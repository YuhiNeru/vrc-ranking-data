name: Update ranking data
on:
  schedule:
    - cron: '57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ranking-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '^24.22.1'
          check-latest: true
      - name: Test stale-data detection
        run: node --test scripts/freshness.test.mjs
      - name: Download and validate public snapshot
        run: node scripts/update.mjs
      - name: Commit newer observations
        run: |
          git add latest.json latest.csv
          if git diff --cached --quiet; then
            echo 'No new observation to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update hourly ranking snapshot'
          git push
